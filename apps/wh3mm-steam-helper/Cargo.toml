[package]
name = "wh3mm-steam-helper"
version = "0.1.0"
description = "Steam Workshop helper protocol executable for WH3 Mod Manager"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
steamworks = "0.13.1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wh3mm-steam-helper"
path = "src/main.rs"

[lints]
workspace = true
