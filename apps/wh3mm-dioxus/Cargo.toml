[package]
name = "wh3mm-dioxus"
version = "1.0.0"
description = "Native WH3 Mod Manager desktop application"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"
build = "build.rs"

[package.metadata.winresource]
OriginalFilename = "wh3mm-dioxus.exe"
ProductName = "WH3 Mod Manager"
FileDescription = "WH3 Mod Manager"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
dioxus-desktop = "0.7"
futures-channel = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.17.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wh3mm-core = { path = "../../crates/wh3mm-core" }
wh3mm-runtime = { path = "../../crates/wh3mm-runtime" }
wh3mm-ui = { path = "../../crates/wh3mm-ui" }

[build-dependencies]
winresource = "0.1.31"
